<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مترجم فوري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<style>
:root {
  --bg: #f2f4f7; --panel: #fff; --fg: #16202e; --muted: #5d6878; --line: #dde2ea;
  --accent: #1b5fc4; --live: #c2410c; --stop: #b42318; --ok: #15803d; --warn-bg: #fff4e5;
  --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --ar: "Noto Naskh Arabic", "Traditional Arabic", serif;
  --en: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141b; --panel: #171e28; --fg: #e6ebf2; --muted: #93a0b2; --line: #2a3442;
  --accent: #6ea3f2; --live: #fb923c; --stop: #f97066; --ok: #4ade80; --warn-bg: #3a2614; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.app {
  height: 100%; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; direction: rtl; }
h1 { margin: 0; font-size: 1.2rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
button { font: inherit; font-size: .95rem; cursor: pointer; border-radius: 10px; padding: 8px 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }

/* Two continuous transcripts: English on the left, Arabic on the right */
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; direction: ltr; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.col h2 { margin: 0; font-size: .95rem; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.text { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; overflow-wrap: anywhere; }
.text p { margin: 0 0 .8em; }
#en { font-family: var(--en); font-size: 1.3rem; line-height: 1.7; direction: ltr; text-align: left; }
#ar { font-family: var(--ar); font-size: 1.5rem; line-height: 1.9; direction: rtl; text-align: right; }
#arCol h2 { direction: rtl; }
.live { color: var(--live); }
.empty { color: var(--muted); font-family: var(--ui); font-size: 1rem; }
@media (max-width: 600px) { #en { font-size: 1.05rem; } #ar { font-size: 1.15rem; } .text { padding: 10px; } }

.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; direction: rtl; }
#mic { flex: 1; min-width: 180px; padding: 16px; font-size: 1.15rem; font-weight: 600;
  background: var(--accent); border-color: var(--accent); color: var(--panel); border-radius: 14px; }
#mic.on { background: var(--stop); border-color: var(--stop); }
.info { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; direction: rtl; font-size: .9rem; color: var(--muted); }
.status.err { color: var(--stop); }
.status.good { color: var(--ok); }
.meter { width: 120px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .1s; }
#micName.bad { color: var(--stop); font-weight: 600; background: var(--warn-bg); padding: 2px 8px; border-radius: 6px; }
label { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>مترجم فوري</h1>
    <div class="seg" role="group" aria-label="لغة المتحدث">
      <button id="d-en" aria-pressed="true">المتحدث: English</button>
      <button id="d-ar" aria-pressed="false">المتحدث: عربي</button>
    </div>
  </header>

  <div class="board">
    <section class="col"><h2>English</h2><div id="en" class="text"><span class="empty">اختر لغة المتحدث ثم اضغط 🎤 ابدأ.</span></div></section>
    <section class="col" id="arCol"><h2>العربية</h2><div id="ar" class="text"></div></section>
  </div>

  <div class="bar">
    <button id="mic">🎤 ابدأ الترجمة</button>
    <label><input id="tts" type="checkbox"> نطق</label>
    <button id="clear">مسح</button>
  </div>
  <div class="info">
    <span id="status" class="status">جاهز</span>
    <span>المايك: <span id="micName">—</span></span>
    <span class="meter" title="مستوى الصوت"><i id="level"></i></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const enBox = $("en"), arBox = $("ar"), statusEl = $("status"), micBtn = $("mic");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isChrome = /Chrome|CriOS/.test(navigator.userAgent);

let src = "en";
let running = false, rec = null, live = null, started = false, lastFinalAt = 0, paraEn = null, paraAr = null;
let lastEventAt = 0, watchdog = null, wakeLock = null, restartTimer = null, meterStream = null, meterRaf = 0;

function status(t, kind) { statusEl.textContent = t; statusEl.className = "status" + (kind ? " " + kind : ""); }
function tgt() { return src === "en" ? "ar" : "en"; }
function label() { return "المتحدث: " + (src === "en" ? "English" : "عربي"); }
function box(lang) { return lang === "en" ? enBox : arBox; }
function near(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 150; }
function stickBoth(fn) { const a = near(enBox), b = near(arBox); fn(); if (a) enBox.scrollTop = enBox.scrollHeight; if (b) arBox.scrollTop = arBox.scrollHeight; }

async function translate(text, from, to) {
  try {
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" + from + "&tl=" + to + "&q=" + encodeURIComponent(text));
    const j = await r.json();
    return j[0].map(x => x[0]).join("");
  } catch (e) {
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=" + from + "|" + to + "&q=" + encodeURIComponent(text));
    const j = await r.json();
    return j.responseData.translatedText;
  }
}

// Text flows as one long script; a new paragraph starts only after a long pause
function newParagraph() {
  paraEn = document.createElement("p"); paraAr = document.createElement("p");
  enBox.append(paraEn); arBox.append(paraAr);
}
function makeItem() {
  if (!started) { enBox.textContent = ""; arBox.textContent = ""; started = true; paraEn = null; }
  if (!paraEn || Date.now() - lastFinalAt > 8000) newParagraph();
  const from = src, to = tgt();
  const srcEl = document.createElement("span"), trEl = document.createElement("span");
  srcEl.className = trEl.className = "live";
  const pf = from === "en" ? paraEn : paraAr, pt = from === "en" ? paraAr : paraEn;
  stickBoth(() => { pf.append(srcEl, " "); pt.append(trEl, " "); });
  return { srcEl, trEl, from, to, seq: 0, shown: 0, lastSent: "", lastAt: 0, timer: null };
}

async function translateInto(item, text) {
  const my = ++item.seq;
  item.lastSent = text; item.lastAt = Date.now();
  try {
    const tr = await translate(text, item.from, item.to);
    if (my < item.shown) return;
    item.shown = my;
    stickBoth(() => { item.trEl.textContent = tr; });
    return tr;
  } catch { if (my >= item.shown) item.trEl.textContent = "[⚠️ تعذرت الترجمة]"; }
}

function showLive(text) {
  if (!live) live = makeItem();
  const item = live;
  stickBoth(() => { item.srcEl.textContent = text; });
  clearTimeout(item.timer);
  const wait = Math.max(0, 600 - (Date.now() - item.lastAt));
  item.timer = setTimeout(() => { if (item.lastSent !== text && item === live) translateInto(item, text); }, wait);
}

async function finalize(text) {
  if (!text) return;
  const item = live || makeItem(); live = null;
  clearTimeout(item.timer);
  lastFinalAt = Date.now();
  item.srcEl.textContent = text; item.srcEl.className = "";
  const tr = await translateInto(item, text);
  item.trEl.className = "";
  if (tr && $("tts").checked) speak(tr, item.to);
}

function speak(text, lang) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(u);
}

// Shows which microphone the browser is using and how loud the room sounds
async function startMeter() {
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    const track = meterStream.getAudioTracks()[0];
    const name = track.label || "الافتراضي";
    const el = $("micName");
    el.textContent = name;
    el.classList.toggle("bad", /iphone|ipad|airpods/i.test(name));
    if (/iphone|ipad/i.test(name)) status("⚠️ المتصفح يستخدم مايك الآيفون. غيّره لمايك الماك من: إعدادات النظام ← الصوت ← الإدخال", "err");
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(meterStream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const tick = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      $("level").style.width = Math.min(100, peak * 1.6) + "%";
      meterRaf = requestAnimationFrame(tick);
    };
    tick();
    meterStream._ctx = ctx;
  } catch {}
}
function stopMeter() {
  cancelAnimationFrame(meterRaf); $("level").style.width = "0";
  if (meterStream) { meterStream.getTracks().forEach(t => t.stop()); meterStream._ctx?.close(); meterStream = null; }
}

function touch() { lastEventAt = Date.now(); }

function startRec() {
  if (!SR) { status("المتصفح ما يدعم المايك. افتح الرابط في Chrome.", "err"); running = false; setBtn(); return; }
  if (rec) { rec.onend = null; rec.onresult = null; rec.onerror = null; try { rec.abort(); } catch {} }
  const r = new SR();
  rec = r;
  r.lang = src === "en" ? "en-US" : "ar-SA";
  r.continuous = isChrome;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onstart = () => { touch(); if (!statusEl.classList.contains("err")) status("🎙️ يسمع — " + label(), "good"); };
  r.onspeechstart = () => { touch(); status("🗣️ يلتقط كلام — " + label(), "good"); };
  r.onresult = e => {
    touch();
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) finalize(res[0].transcript.trim());
      else interim += res[0].transcript;
    }
    if (interim.trim()) showLive(interim.trim());
  };
  r.onerror = e => {
    if (e.error === "not-allowed") { stopAll(); status("المتصفح ما عنده إذن للمايك. اسمح بالمايك لهذا الموقع ثم اضغط ابدأ.", "err"); }
    else if (e.error === "service-not-allowed") { stopAll(); status("خدمة التعرف على الكلام مقفلة. افتح الرابط في Chrome.", "err"); }
    else if (e.error === "audio-capture") { stopAll(); status("ما فيه مايك متاح. اسمح للمتصفح بالمايك من إعدادات النظام ← الخصوصية ← الميكروفون.", "err"); }
    else if (e.error === "network") status("انقطاع إنترنت — يرجع يسمع تلقائيًا…", "err");
  };
  r.onend = () => {
    if (!running || rec !== r) return;
    if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => { if (running) startRec(); }, 150);
  };
  touch();
  try { r.start(); } catch (err) { restartTimer = setTimeout(() => { if (running) startRec(); }, 500); }
}

function startWatchdog() {
  clearInterval(watchdog);
  watchdog = setInterval(() => { if (running && Date.now() - lastEventAt > 12000) { touch(); startRec(); } }, 3000);
}
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}

function setBtn() { micBtn.classList.toggle("on", running); micBtn.textContent = running ? "⏹ إيقاف" : "🎤 ابدأ الترجمة"; }
function stopAll() {
  running = false; setBtn();
  clearInterval(watchdog); clearTimeout(restartTimer);
  if (rec) { rec.onend = null; try { rec.stop(); } catch {} }
  if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  stopMeter();
}
micBtn.onclick = () => {
  if (running) { stopAll(); status("متوقف"); return; }
  running = true; setBtn();
  status("يشغّل المايك…");
  startMeter(); startRec(); startWatchdog(); keepAwake();
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) { keepAwake(); touch(); startRec(); } });

function setDir(d) {
  src = d;
  $("d-en").setAttribute("aria-pressed", String(d === "en"));
  $("d-ar").setAttribute("aria-pressed", String(d === "ar"));
  if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
  live = null;
  status(label());
  if (running) startRec();
}
$("d-en").onclick = () => setDir("en");
$("d-ar").onclick = () => setDir("ar");
$("clear").onclick = () => { enBox.textContent = ""; arBox.textContent = ""; live = null; paraEn = null; started = true; };
</script>
</body>
</html>
