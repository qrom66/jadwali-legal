<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>مترجم فوري</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;600&family=Noto+Naskh+Arabic:wght@500;600&display=swap">
<style>
:root {
  --bg: #f2f4f7; --panel: #fff; --fg: #16202e; --muted: #5d6878; --line: #dde2ea;
  --accent: #1b5fc4; --live: #c2410c; --stop: #b42318; --ok: #15803d; --warn-bg: #fff4e5;
  --ui: "IBM Plex Sans Arabic", "Segoe UI", Tahoma, sans-serif;
  --ar: "Noto Naskh Arabic", "Traditional Arabic", serif;
  --en: system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) { :root {
  --bg: #0f141b; --panel: #171e28; --fg: #e6ebf2; --muted: #93a0b2; --line: #2a3442;
  --accent: #6ea3f2; --live: #fb923c; --stop: #f97066; --ok: #4ade80; --warn-bg: #3a2614; color-scheme: dark } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--ui); }
.app {
  height: 100%; max-width: 1500px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}
header { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; direction: rtl; }
h1 { margin: 0; font-size: 1.2rem; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; border-radius: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 600; }
button { font: inherit; font-size: .95rem; cursor: pointer; border-radius: 10px; padding: 8px 12px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }

/* Two continuous transcripts: English on the left, Arabic on the right */
.board { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; direction: ltr; }
.col { display: flex; flex-direction: column; min-height: 0; min-width: 0; background: var(--panel);
  border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.col h2 { margin: 0; font-size: .95rem; padding: 10px 16px; border-bottom: 1px solid var(--line); }
.text { flex: 1; min-height: 0; overflow-y: auto; padding: 14px 18px; overflow-wrap: anywhere; }
.text p { margin: 0 0 .8em; }
#en { font-family: var(--en); font-size: 1.3rem; line-height: 1.7; direction: ltr; text-align: left; }
#ar { font-family: var(--ar); font-size: 1.5rem; line-height: 1.9; direction: rtl; text-align: right; }
#arCol h2 { direction: rtl; }
.live { color: var(--live); }
.empty { color: var(--muted); font-family: var(--ui); font-size: 1rem; }
@media (max-width: 600px) { #en { font-size: 1.05rem; } #ar { font-size: 1.15rem; } .text { padding: 10px; } }

.bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; direction: rtl; }
#mic { flex: 1; min-width: 180px; padding: 16px; font-size: 1.15rem; font-weight: 600;
  background: var(--accent); border-color: var(--accent); color: var(--panel); border-radius: 14px; }
#mic.on { background: var(--stop); border-color: var(--stop); }
.info { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; direction: rtl; font-size: .9rem; color: var(--muted); }
.status.err { color: var(--stop); }
.status.good { color: var(--ok); }
.meter { width: 120px; height: 8px; border-radius: 4px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .1s; }
#micName.bad { color: var(--stop); font-weight: 600; background: var(--warn-bg); padding: 2px 8px; border-radius: 6px; }
label { display: inline-flex; gap: 6px; align-items: center; font-size: .9rem; }
.keypanel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; direction: rtl; }
.keypanel[hidden] { display: none; }
#keyInput { flex: 1; min-width: 220px; font: inherit; padding: 8px 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--panel); color: var(--fg); }
.hint { font-size: .8rem; color: var(--muted); }
#engine.on { color: var(--ok); font-weight: 600; }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>مترجم فوري</h1>
    <div class="seg" role="group" aria-label="لغة المتحدث">
      <button id="d-en" aria-pressed="true">المتحدث: English</button>
      <button id="d-ar" aria-pressed="false">المتحدث: عربي</button>
    </div>
  </header>

  <div class="board">
    <section class="col"><h2>English</h2><div id="en" class="text"><span class="empty">اختر لغة المتحدث ثم اضغط 🎤 ابدأ.</span></div></section>
    <section class="col" id="arCol"><h2>العربية</h2><div id="ar" class="text"></div></section>
  </div>

  <div class="bar">
    <button id="mic">🎤 ابدأ الترجمة</button>
    <label><input id="tts" type="checkbox"> نطق</label>
    <button id="clear">مسح</button>
    <button id="keyBtn">🔑 Claude</button>
  </div>
  <div id="keyPanel" class="keypanel" hidden>
    <input id="keyInput" type="password" placeholder="sk-ant-..." autocomplete="off" dir="ltr">
    <button id="keySave">حفظ</button>
    <button id="keyRemove">حذف</button>
    <span class="hint">المفتاح ينحفظ في متصفحك هذا بس، وما يرفع لأي مكان غير Anthropic.</span>
  </div>
  <div class="info">
    <span id="status" class="status">جاهز</span>
    <span>المايك: <span id="micName">—</span></span>
    <span class="meter" title="مستوى الصوت"><i id="level"></i></span>
    <span>الترجمة: <span id="engine">Google</span></span>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const enBox = $("en"), arBox = $("ar"), statusEl = $("status"), micBtn = $("mic");
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
// On a phone the built-in mic is the right one, so the "using the iPhone mic" note is only for computers
const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) || (/Macintosh/.test(navigator.userAgent) && navigator.maxTouchPoints > 1);
const isChrome = /Chrome|CriOS/.test(navigator.userAgent);

let src = "en";
let running = false, rec = null, live = null, started = false, lastFinalAt = 0, paraEn = null, paraAr = null;
let lastEventAt = 0, watchdog = null, wakeLock = null, restartTimer = null, meterStream = null, meterRaf = 0;

function status(t, kind) { statusEl.textContent = t; statusEl.className = "status" + (kind ? " " + kind : ""); }
function tgt() { return src === "en" ? "ar" : "en"; }
function label() { return "المتحدث: " + (src === "en" ? "English" : "عربي"); }
function box(lang) { return lang === "en" ? enBox : arBox; }
function near(el) { return el.scrollHeight - el.scrollTop - el.clientHeight < 150; }
function stickBoth(fn) { const a = near(enBox), b = near(arBox); fn(); if (a) enBox.scrollTop = enBox.scrollHeight; if (b) arBox.scrollTop = arBox.scrollHeight; }

async function translate(text, from, to) {
  try {
    const r = await fetch("https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=" + from + "&tl=" + to + "&q=" + encodeURIComponent(text));
    const j = await r.json();
    return j[0].map(x => x[0]).join("");
  } catch (e) {
    const r = await fetch("https://api.mymemory.translated.net/get?langpair=" + from + "|" + to + "&q=" + encodeURIComponent(text));
    const j = await r.json();
    return j.responseData.translatedText;
  }
}

// Finished sentences are translated by Claude; Google only fills in while a sentence is still being spoken.
// Served by the Cloudflare Worker, the page sends text to /translate with a PIN (the API key stays on the server);
// opened anywhere else, it calls Claude directly with a key saved in this browser.
const PROXY = window.TRANSLATE_PROXY || "";
const CLAUDE_MODEL = "claude-haiku-5-5";
const SDK_URL = "https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.131.0/+esm";
const STORE = PROXY ? "appPin" : "claudeKey";
let claudeKey = "";   // the PIN in proxy mode, the API key otherwise
try { claudeKey = localStorage.getItem(STORE) || ""; } catch {}
let clientPromise = null, recent = [];

if (PROXY) {
  $("keyBtn").textContent = "🔑 رمز الدخول";
  $("keyInput").placeholder = "رمز الدخول";
  $("keyPanel").querySelector(".hint").textContent = "اكتب رمز الدخول مرة وحدة، وينحفظ في هذا الجهاز.";
}

function showEngine() { const e = $("engine"); e.textContent = claudeKey ? "Claude ✓" : "Google"; e.classList.toggle("on", !!claudeKey); }
function getClaude() {
  if (!clientPromise) clientPromise = import(SDK_URL)
    .then(m => new m.default({ apiKey: claudeKey, dangerouslyAllowBrowser: true }))
    .catch(e => { clientPromise = null; throw e; });
  return clientPromise;
}
function buildPrompt(text, to, context) {
  const target = to === "ar" ? "clear, natural Modern Standard Arabic" : "clear, natural English";
  return {
    system: "You are a live conference interpreter helping a listener follow a speaker. " +
      "Translate the text inside <speech_to_translate> into " + target + ", faithfully and completely. " +
      "Keep every detail the speaker said: words like first, next, last, this, today; the exact event words (conference, session, talk, event); " +
      "tense, numbers, names and technical terms. Do not drop anything, do not add anything that was not said, and do not swap a word for a related one. " +
      "Use natural wording, but stay close to the original meaning. " +
      "The text comes from speech recognition and may lack punctuation or stop mid-sentence; translate it as it is. " +
      "Only fix a word if it is clearly a recognition error that makes no sense in the sentence. " +
      "The earlier speech is for context only: never translate or repeat it. Reply with the translation only, no notes or quotes.",
    content: (context ? "<earlier_speech_for_context>\n" + context + "\n</earlier_speech_for_context>\n\n" : "") +
      "<speech_to_translate>\n" + text + "\n</speech_to_translate>"
  };
}
async function claudeTranslate(text, from, to, context) {
  const { system, content } = buildPrompt(text, to, context);
  if (PROXY) {
    const r = await fetch(PROXY, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ pin: claudeKey, system, content }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) { const err = new Error(data.message || data.error || "error"); err.status = data.error === "bad_pin" ? "pin" : (data.status || r.status); throw err; }
    return data.text;
  }
  const client = await getClaude();
  const res = await client.messages.create({
    model: CLAUDE_MODEL,
    max_tokens: 2000,
    thinking: { type: "adaptive" },
    output_config: { effort: "low" },
    system,
    messages: [{ role: "user", content }]
  });
  const out = res.content.filter(b => b.type === "text").map(b => b.text).join("").trim();
  if (!out) throw new Error("empty response");
  return out;
}
function claudeError(e) {
  const s = e?.status;
  status(s === "pin" ? "رمز الدخول غلط — صحّحه من زر 🔑" :
         s === 401 ? "مفتاح Claude غير صحيح" + (PROXY ? " — صحّحه في إعدادات Cloudflare" : " — صحّحه من زر 🔑") :
         s === 402 || s === 400 && /credit/i.test(e?.message || "") ? "رصيد Anthropic خلص — اشحن الحساب" :
         s === 429 ? "ضغط على Claude — يستخدم Google مؤقتًا" :
         "تعذر الوصول لـ Claude — يستخدم Google مؤقتًا", "err");
}

$("keyBtn").onclick = () => { const p = $("keyPanel"); p.hidden = !p.hidden; if (!p.hidden) $("keyInput").focus(); };
$("keySave").onclick = () => {
  const k = $("keyInput").value.trim();
  if (!k) return;
  claudeKey = k; clientPromise = null;
  try { localStorage.setItem(STORE, k); } catch {}
  $("keyInput").value = ""; $("keyPanel").hidden = true; showEngine(); status("تم الحفظ — الترجمة الحين بـ Claude", "good");
};
$("keyRemove").onclick = () => {
  claudeKey = ""; clientPromise = null;
  try { localStorage.removeItem(STORE); } catch {}
  $("keyPanel").hidden = true; showEngine(); status("تم الحذف");
};
showEngine();

// iPhone / Safari: their built-in speech recognition is unreliable, so record the mic here,
// cut the audio at natural pauses, and let Whisper on the Worker turn each piece into text.
const UA = navigator.userAgent;
const desktopOrAndroidChrome = /Chrome|Android/.test(UA) && !/iPhone|iPad|iPod|CriOS/.test(UA) && !(/Macintosh/.test(UA) && navigator.maxTouchPoints > 1);
const useWhisper = !!PROXY && !desktopOrAndroidChrome;
let wh = null;

function encodeWav(samples, rate) {
  const buf = new ArrayBuffer(44 + samples.length * 2), v = new DataView(buf);
  const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
  w(0, "RIFF"); v.setUint32(4, 36 + samples.length * 2, true); w(8, "WAVE"); w(12, "fmt ");
  v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, rate, true);
  v.setUint32(28, rate * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, "data"); v.setUint32(40, samples.length * 2, true);
  for (let i = 0; i < samples.length; i++) { const x = Math.max(-1, Math.min(1, samples[i])); v.setInt16(44 + i * 2, x < 0 ? x * 0x8000 : x * 0x7fff, true); }
  return new Uint8Array(buf);
}
function toBase64(bytes) {
  let bin = ""; for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function downsample(chunks, inRate) {
  const total = chunks.reduce((n, c) => n + c.length, 0), all = new Float32Array(total);
  let o = 0; for (const c of chunks) { all.set(c, o); o += c.length; }
  const ratio = inRate / 16000, out = new Float32Array(Math.floor(total / ratio));
  for (let i = 0; i < out.length; i++) {
    const a = Math.floor(i * ratio), b = Math.min(total, Math.floor((i + 1) * ratio));
    let sum = 0; for (let j = a; j < b; j++) sum += all[j]; out[i] = sum / Math.max(1, b - a);
  }
  return out;
}

async function sendChunk(chunks, rate) {
  const item = makeItem();
  stickBoth(() => { item.srcEl.textContent = "…"; item.trEl.textContent = "…"; });
  const wav = encodeWav(downsample(chunks, rate), 16000);
  try {
    const r = await fetch("/transcribe", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ pin: claudeKey, audio: toBase64(wav), language: item.from }) });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw Object.assign(new Error(data.error || "error"), { status: data.error === "bad_pin" ? "pin" : r.status });
    const text = (data.text || "").trim();
    if (!text) { item.srcEl.remove(); item.trEl.remove(); return; }
    finalize(text, item);
  } catch (e) {
    item.srcEl.remove(); item.trEl.remove();
    status(e.status === "pin" ? "رمز الدخول غلط — صحّحه من زر 🔑" :
           e.status === 404 ? "الموقع يحتاج تحديث في Cloudflare عشان يشتغل على الآيفون" :
           "تعذر تحويل الصوت لنص — يكمل يحاول", "err");
  }
}

async function startWhisper() {
  if (!claudeKey) { $("keyPanel").hidden = false; status("اكتب رمز الدخول أول", "err"); stopAll(); return; }
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  ctx.resume();
  let stream;
  try { stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: true, autoGainControl: true } }); }
  catch { ctx.close(); stopAll(); status("المتصفح ما عنده إذن للمايك. اسمح بالمايك من إعدادات Safari ثم اضغط ابدأ.", "err"); return; }
  if (!running) { stream.getTracks().forEach(t => t.stop()); ctx.close(); return; }
  $("micName").textContent = isMobile ? "مايك الجوال" : (stream.getAudioTracks()[0].label || "الافتراضي");
  const srcNode = ctx.createMediaStreamSource(stream);
  const proc = ctx.createScriptProcessor(4096, 1, 1);
  const mute = ctx.createGain(); mute.gain.value = 0;
  srcNode.connect(proc); proc.connect(mute); mute.connect(ctx.destination);
  const rate = ctx.sampleRate, blockSec = 4096 / rate;
  // Cut at a pause once a phrase has ~1s of speech, or force a cut after 7s of nonstop talking
  let chunks = [], speech = 0, silence = 0, noise = 0.01;
  const preroll = [];
  proc.onaudioprocess = e => {
    const x = new Float32Array(e.inputBuffer.getChannelData(0));
    let sq = 0; for (let i = 0; i < x.length; i += 4) sq += x[i] * x[i];
    const rms = Math.sqrt(sq / (x.length / 4));
    $("level").style.width = Math.min(100, rms * 600) + "%";
    const loud = rms > Math.max(0.004, noise * 2.2);
    if (!loud) noise = noise * 0.97 + rms * 0.03;
    if (loud) {
      if (!chunks.length) { chunks.push(...preroll); status("🗣️ يلتقط كلام — " + label(), "good"); }
      chunks.push(x); speech += blockSec; silence = 0;
    } else if (chunks.length) {
      chunks.push(x); silence += blockSec;
    } else {
      preroll.push(x); if (preroll.length > 4) preroll.shift();
    }
    const length = chunks.length * blockSec;
    if (chunks.length && ((speech >= 0.8 && silence >= 0.6) || length >= 7)) {
      const piece = chunks; chunks = []; speech = 0; silence = 0;
      sendChunk(piece, rate);
    } else if (chunks.length && speech < 0.3 && silence >= 0.8) {
      chunks = []; speech = 0; silence = 0;   // a short noise, not speech
    }
  };
  wh = { ctx, stream, proc };
  status("🎙️ يسمع — " + label(), "good");
}
function stopWhisper() {
  if (!wh) return;
  wh.proc.onaudioprocess = null;
  wh.stream.getTracks().forEach(t => t.stop());
  wh.ctx.close().catch(() => {});
  wh = null; $("level").style.width = "0";
}

if (PROXY && !claudeKey) { $("keyPanel").hidden = false; status("اكتب رمز الدخول عشان تشتغل ترجمة Claude"); }

// Text flows as one long script; a new paragraph starts only after a long pause
function newParagraph() {
  paraEn = document.createElement("p"); paraAr = document.createElement("p");
  enBox.append(paraEn); arBox.append(paraAr);
}
function makeItem() {
  if (!started) { enBox.textContent = ""; arBox.textContent = ""; started = true; paraEn = null; }
  if (!paraEn || Date.now() - lastFinalAt > 8000) newParagraph();
  const from = src, to = tgt();
  const srcEl = document.createElement("span"), trEl = document.createElement("span");
  srcEl.className = trEl.className = "live";
  const pf = from === "en" ? paraEn : paraAr, pt = from === "en" ? paraAr : paraEn;
  stickBoth(() => { pf.append(srcEl, " "); pt.append(trEl, " "); });
  return { srcEl, trEl, from, to, seq: 0, shown: 0, lastSent: "", lastAt: 0, timer: null };
}

async function translateInto(item, text) {
  const my = ++item.seq;
  item.lastSent = text; item.lastAt = Date.now();
  try {
    const tr = await translate(text, item.from, item.to);
    if (my < item.shown) return;
    item.shown = my;
    stickBoth(() => { item.trEl.textContent = tr; });
    return tr;
  } catch { if (my >= item.shown) item.trEl.textContent = "[⚠️ تعذرت الترجمة]"; }
}

function showLive(text) {
  if (!live) live = makeItem();
  const item = live;
  stickBoth(() => { item.srcEl.textContent = text; });
  clearTimeout(item.timer);
  const wait = Math.max(0, 600 - (Date.now() - item.lastAt));
  item.timer = setTimeout(() => { if (item.lastSent !== text && item === live) translateInto(item, text); }, wait);
}

async function finalize(text, given) {
  if (!text) return;
  let item = given;
  if (!item) { item = live || makeItem(); live = null; }
  clearTimeout(item.timer);
  lastFinalAt = Date.now();
  item.srcEl.textContent = text; item.srcEl.className = "";
  const context = recent.join(" ");
  recent.push(text); if (recent.length > 4) recent.shift();
  let tr;
  if (claudeKey) {
    const my = ++item.seq;
    try {
      tr = await claudeTranslate(text, item.from, item.to, context);
      if (my >= item.shown) { item.shown = my; stickBoth(() => { item.trEl.textContent = tr; }); }
      if (statusEl.classList.contains("err") && running) status("🎙️ يسمع — " + label(), "good");
    } catch (e) { claudeError(e); tr = await translateInto(item, text); }
  } else tr = await translateInto(item, text);
  item.trEl.className = "";
  if (tr && $("tts").checked) speak(tr, item.to);
}

function speak(text, lang) {
  if (!window.speechSynthesis) return;
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang === "ar" ? "ar-SA" : "en-US";
  speechSynthesis.speak(u);
}

// Shows which microphone the browser is using and how loud the room sounds
async function startMeter() {
  try {
    meterStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    const track = meterStream.getAudioTracks()[0];
    const name = track.label || "الافتراضي";
    const el = $("micName");
    el.textContent = name;
    if (isMobile) el.textContent = "مايك الجوال";
    el.classList.toggle("bad", !isMobile && /iphone|ipad/i.test(name));
    if (!isMobile && /iphone|ipad/i.test(name)) status("ℹ️ الماك يستخدم مايك الآيفون. إذا تبي مايك الماك غيّره من أيقونة المايك في شريط العنوان", "");
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const an = ctx.createAnalyser(); an.fftSize = 512;
    ctx.createMediaStreamSource(meterStream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    const tick = () => {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      $("level").style.width = Math.min(100, peak * 1.6) + "%";
      meterRaf = requestAnimationFrame(tick);
    };
    tick();
    meterStream._ctx = ctx;
  } catch {}
}
function stopMeter() {
  cancelAnimationFrame(meterRaf); $("level").style.width = "0";
  if (meterStream) { meterStream.getTracks().forEach(t => t.stop()); meterStream._ctx?.close(); meterStream = null; }
}

function touch() { lastEventAt = Date.now(); }

function startRec() {
  if (!SR) { status("المتصفح ما يدعم المايك. افتح الرابط في Chrome.", "err"); running = false; setBtn(); return; }
  if (rec) { rec.onend = null; rec.onresult = null; rec.onerror = null; try { rec.abort(); } catch {} }
  const r = new SR();
  rec = r;
  r.lang = src === "en" ? "en-US" : "ar-SA";
  r.continuous = isChrome;
  r.interimResults = true;
  r.maxAlternatives = 1;
  r.onstart = () => { touch(); if (!statusEl.classList.contains("err")) status("🎙️ يسمع — " + label(), "good"); };
  r.onspeechstart = () => { touch(); status("🗣️ يلتقط كلام — " + label(), "good"); };
  r.onresult = e => {
    touch();
    let interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      const res = e.results[i];
      if (res.isFinal) finalize(res[0].transcript.trim());
      else interim += res[0].transcript;
    }
    if (interim.trim()) showLive(interim.trim());
  };
  r.onerror = e => {
    if (e.error === "not-allowed") { stopAll(); status("المتصفح ما عنده إذن للمايك. اسمح بالمايك لهذا الموقع ثم اضغط ابدأ.", "err"); }
    else if (e.error === "service-not-allowed") { stopAll(); status("خدمة التعرف على الكلام مقفلة. افتح الرابط في Chrome.", "err"); }
    else if (e.error === "audio-capture") { stopAll(); status("ما فيه مايك متاح. اسمح للمتصفح بالمايك من إعدادات النظام ← الخصوصية ← الميكروفون.", "err"); }
    else if (e.error === "network") status("انقطاع إنترنت — يرجع يسمع تلقائيًا…", "err");
  };
  r.onend = () => {
    if (!running || rec !== r) return;
    if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
    clearTimeout(restartTimer);
    restartTimer = setTimeout(() => { if (running) startRec(); }, 150);
  };
  touch();
  try { r.start(); } catch (err) { restartTimer = setTimeout(() => { if (running) startRec(); }, 500); }
}

function startWatchdog() {
  clearInterval(watchdog);
  watchdog = setInterval(() => { if (running && Date.now() - lastEventAt > 12000) { touch(); startRec(); } }, 3000);
}
async function keepAwake() {
  try { if ("wakeLock" in navigator && !wakeLock) { wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", () => { wakeLock = null; }); } } catch {}
}

function setBtn() { micBtn.classList.toggle("on", running); micBtn.textContent = running ? "⏹ إيقاف" : "🎤 ابدأ الترجمة"; }
function stopAll() {
  running = false; setBtn();
  clearInterval(watchdog); clearTimeout(restartTimer);
  if (rec) { rec.onend = null; try { rec.stop(); } catch {} }
  if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  stopMeter(); stopWhisper();
}
micBtn.onclick = () => {
  if (running) { stopAll(); status("متوقف"); return; }
  running = true; setBtn();
  status("يشغّل المايك…");
  if (useWhisper) { startWhisper(); keepAwake(); return; }
  startMeter(); startRec(); startWatchdog(); keepAwake();
};
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running && !useWhisper) { keepAwake(); touch(); startRec(); } });

function setDir(d) {
  src = d;
  $("d-en").setAttribute("aria-pressed", String(d === "en"));
  $("d-ar").setAttribute("aria-pressed", String(d === "ar"));
  if (live && live.srcEl.textContent) finalize(live.srcEl.textContent);
  live = null;
  status(label());
  if (running && !useWhisper) startRec();
}
$("d-en").onclick = () => setDir("en");
$("d-ar").onclick = () => setDir("ar");
$("clear").onclick = () => { enBox.textContent = ""; arBox.textContent = ""; live = null; paraEn = null; started = true; };
</script>
</body>
